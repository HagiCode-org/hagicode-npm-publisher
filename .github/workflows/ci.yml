name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Node 24)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:registry
      - run: pnpm run check:registry
      - run: pnpm test

  smoke:
    # The action refuses pull_request events in auto mode, so the smoke job runs on pushes only.
    name: Action smoke (dry run)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - id: publisher
        uses: ./
        with:
          mode: dev
          dry-run: "true"
          working-directory: test/fixtures/smoke
          expected-workflow: .github/workflows/ci.yml
          install-command: npm ci
      - name: Assert outputs
        env:
          VERSION: ${{ steps.publisher.outputs.version }}
          DIST_TAG: ${{ steps.publisher.outputs.dist-tag }}
          PUBLISHED: ${{ steps.publisher.outputs.published }}
        run: |
          set -euo pipefail
          test -n "$VERSION"
          test "$DIST_TAG" = "dev"
          test "$PUBLISHED" = "false"
          case "$VERSION" in
            0.1.0-dev.*) echo "version $VERSION ok" ;;
            *) echo "unexpected version $VERSION"; exit 1 ;;
          esac
